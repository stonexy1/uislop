name: Rule request / Новое правило
description: A generic UI pattern slopscan misses / Шаблонный паттерн, который slopscan пропускает
labels: ["rule request"]
body:
  - type: markdown
    attributes:
      value: |
        English or Russian is fine. / Можно писать на английском или русском.
  - type: dropdown
    id: category
    attributes:
      label: Category / Категория
      options:
        - color-slop
        - emoji-ui
        - copy-slop
        - layout-slop
        - typo-slop
        - fake-ui
        - new category / новая категория
    validations:
      required: true
  - type: textarea
    id: pattern
    attributes:
      label: Pattern / Паттерн
      description: What the generated UI looks like, with a code snippet. / Как выглядит шаблонный интерфейс, с фрагментом кода.
      render: tsx
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: What a crafted version does instead / Как выглядит продуманная версия
    validations:
      required: true
  - type: textarea
    id: false-positives
    attributes:
      label: Where it would be legitimate / Где этот паттерн уместен
      description: Cases the rule must not flag. / Случаи, на которые правило не должно срабатывать.
